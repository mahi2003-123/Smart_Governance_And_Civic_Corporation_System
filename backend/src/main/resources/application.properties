# Server Configuration
server.port=${PORT:5000}
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgcs_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1102003}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# JWT Configuration
sgcs.app.jwtSecret=${JWT_SECRET:changeme_secure_jwt_secret_key_placeholder_for_development}
sgcs.app.jwtExpirationMs=86400000

# Logging Levels
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.sgcs=DEBUG

firebase.admin.credentials.file=${FIREBASE_CREDENTIALS_FILE:}

ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}
