# Server Configuration
server.port=${PORT:5000}
server.servlet.context-path=/

# Request & Multipart Size Limits (max 8MB for images and complaint payloads)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.tomcat.max-http-form-post-size=8MB
server.tomcat.max-swallow-size=8MB

# PostgreSQL Datasource Configuration (supports Neon serverless, Render, Railway DATABASE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgcs_db}}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Data Seeding Control - strictly disabled by default to prevent any seeded or mock data in Neon DB
data.seeding.enabled=${DATA_SEEDING_ENABLED:false}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Connection Pool Settings (Tuned for Render & Neon Serverless)
# min-idle=0 allows pool to scale down to zero connections when idle, allowing Neon compute to auto-suspend
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:120000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME:0}

# JWT Configuration — JWT_SECRET must be set in production; no default for security
sgcs.app.jwtSecret=${JWT_SECRET}
sgcs.app.jwtExpirationMs=28800000

# Logging Levels
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.sgcs=INFO

# Firebase — disabled by default; set firebase.enabled=true + supply credentials to enable push notifications
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.admin.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.admin.credentials.file=${FIREBASE_CREDENTIALS_FILE:}

# AI Service — secure internal AI service integration
ai.service.url=${AI_SERVICE_URL:}
ai.internal.key=${AI_INTERNAL_KEY:}

# CORS — set CORS_ALLOWED_ORIGINS to frontend domains in Render dashboard
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://sgcs-frontend.onrender.com}

# Admin seeding — set ADMIN_EMAIL and ADMIN_PASSWORD in production env
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
