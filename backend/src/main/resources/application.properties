# Server Configuration
server.port=${PORT:5000}
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sgcs_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# JWT Configuration — JWT_SECRET must be set in production; no default for security
sgcs.app.jwtSecret=${JWT_SECRET}
sgcs.app.jwtExpirationMs=86400000

# Logging Levels
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.sgcs=INFO

# Firebase — disabled by default; set firebase.enabled=true + supply credentials to enable push notifications
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.admin.credentials.json=${FIREBASE_CREDENTIALS_JSON:}
firebase.admin.credentials.file=${FIREBASE_CREDENTIALS_FILE:}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# CORS — set CORS_ALLOWED_ORIGINS to frontend domains in Render dashboard
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://sgcs-frontend.onrender.com}

# Admin seeding — set ADMIN_EMAIL and ADMIN_PASSWORD in production env
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
