# Test profile — in-memory PostgreSQL-compatible H2 database for reliable offline testing
sgcs.app.jwtSecret=test_jwt_secret_key_for_ci_only_not_for_production_use_12345678901234567890
spring.datasource.url=jdbc:h2:mem:sgcs_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
firebase.enabled=false
cors.allowed.origins=http://localhost:5173,https://sgcs-frontend.onrender.com
