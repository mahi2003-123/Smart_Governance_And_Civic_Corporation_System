services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: sgcs-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .         # Root context so COPY backend/... works inside Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: sgcs-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sgcs-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sgcs-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sgcs-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sgcs-postgres
          property: password
      # External Neon Serverless PostgreSQL connection URL (takes precedence when supplied)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_SEEDING_ENABLED
        value: "false"
      - key: AI_SERVICE_URL
        value: https://sgcs-ai-service.onrender.com
      # Shared secret between backend and AI service - set manually to match in both services
      - key: AI_INTERNAL_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # - key: FIREBASE_ENABLED          true  (optional, only if Firebase creds are supplied)
      # - key: FIREBASE_CREDENTIALS_JSON  (optional, paste the service-account JSON)

  # 2. FastAPI AI Service
  - type: web
    name: sgcs-ai-service
    env: python
    buildCommand: cd ai_service && pip install -r requirements.txt
    startCommand: cd ai_service && uvicorn app:app --host 0.0.0.0 --port 10000
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: AI_INTERNAL_KEY
        generateValue: true

# 3. PostgreSQL Database
databases:
  - name: sgcs-postgres
    databaseName: sgcs_db
    user: sgcs_user
    plan: free
