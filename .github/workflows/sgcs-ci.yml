# SGCS CI/CD Pipeline Configuration

name: SGCS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Linting
        run: npm run lint

      - name: Build Frontend Application
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  backend-postgres-ci:
    name: Backend & PostgreSQL CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sgcs_test_db
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Spring Boot & Database Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sgcs_test_db
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword
        run: mvn clean test

      - name: Package Backend Application
        run: mvn package -DskipTests

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  ai-fastapi-ci:
    name: AI Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt pytest httpx

      - name: Start FastAPI Service in background
        working-directory: ./ai_service
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8005 &
          # Wait for the service to become responsive
          sleep 10
          curl -f http://127.0.0.1:8005/health || exit 1

      - name: Run Integration Tests
        working-directory: ./ai_service
        run: python test_integration.py

      - name: Upload AI Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model
          path: |
            ai_service/complaint_model.joblib
            ai_service/requirements.txt

  selenium-e2e:
    name: Selenium E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-postgres-ci, ai-fastapi-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Chrome WebDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Selenium Tests (Headless)
        working-directory: ./automation-tests
        run: mvn test
        env:
          CITIZEN_TEST_EMAIL: ${{ secrets.CITIZEN_TEST_EMAIL }}
          CITIZEN_TEST_PASSWORD: ${{ secrets.CITIZEN_TEST_PASSWORD }}
        # We allow this to succeed even if some E2E tests skip due to missing creds in PR
        continue-on-error: true

      - name: Upload TestNG Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-reports
          path: automation-tests/target/surefire-reports/


  playwright-e2e:
    name: Playwright E2E Master
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-postgres-ci, ai-fastapi-ci]
    continue-on-error: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: ./playwright-tests
        run: npm ci && npx playwright install chromium

      - name: Run Playwright Tests
        working-directory: ./playwright-tests
        run: npx playwright test
        env:
          CITIZEN_EMAIL: ${{ secrets.CITIZEN_TEST_EMAIL }}
          CITIZEN_PASSWORD: ${{ secrets.CITIZEN_TEST_PASSWORD }}
          COUNCILLOR_EMAIL: ${{ secrets.COUNCILLOR_TEST_EMAIL }}
          COUNCILLOR_PASSWORD: ${{ secrets.COUNCILLOR_TEST_PASSWORD }}
          WORKER_EMAIL: ${{ secrets.WORKER_TEST_EMAIL }}
          WORKER_PASSWORD: ${{ secrets.WORKER_TEST_PASSWORD }}
          BASE_URL: ${{ secrets.PROD_FRONTEND_URL }} # or spin up local UI in future

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 7

  deploy-to-render:
    name: Deploy to Render CD
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-postgres-ci, ai-fastapi-ci]
    # Only deploy on main branch push. Prevents PRs from deploying broken code.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Frontend Render Deploy
        env:
          deploy_url: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$deploy_url" ]; then
            echo "::warning::RENDER_FRONTEND_DEPLOY_HOOK is not set — skipping frontend deploy."
          else
            curl -X POST -H "Accept: application/json" -d "" "$deploy_url"
          fi

      - name: Trigger Backend Render Deploy
        env:
          deploy_url: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$deploy_url" ]; then
            echo "::warning::RENDER_BACKEND_DEPLOY_HOOK is not set — skipping backend deploy."
          else
            curl -X POST -H "Accept: application/json" -d "" "$deploy_url"
          fi

      - name: Trigger AI Service Render Deploy
        env:
          deploy_url: ${{ secrets.RENDER_AI_DEPLOY_HOOK }}
        run: |
          if [ -z "$deploy_url" ]; then
            echo "::warning::RENDER_AI_DEPLOY_HOOK is not set — skipping AI service deploy."
          else
            curl -X POST -H "Accept: application/json" -d "" "$deploy_url"
          fi

  post-deployment-smoke:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-to-render]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verify Frontend Reachability
        run: |
          if [ -z "${{ secrets.PROD_FRONTEND_URL }}" ]; then
            echo "::warning::PROD_FRONTEND_URL not set — skipping frontend smoke test."
          else
            curl -sI ${{ secrets.PROD_FRONTEND_URL }} | head -n 1
          fi

      - name: Verify Backend Health (with retries for cold start)
        run: |
          if [ -z "${{ secrets.PROD_BACKEND_URL }}" ]; then
            echo "::warning::PROD_BACKEND_URL not set — skipping backend health check."
            exit 0
          fi
          BASE_URL="${{ secrets.PROD_BACKEND_URL }}"
          BASE_URL="${BASE_URL%/}"
          HEALTH_URL="${BASE_URL%/api}/api/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Health check attempt $i/$MAX_ATTEMPTS: $HEALTH_URL"
            if curl -f -s -S --max-time 15 "$HEALTH_URL" > /dev/null; then
              echo "Backend is UP (HTTP 200)."
              exit 0
            fi
            echo "Health check failed (HTTP non-200 or timeout) — waiting ${SLEEP_SECONDS}s before retry..."
            sleep $SLEEP_SECONDS
          done
          echo "Backend did not return 200 after $MAX_ATTEMPTS attempts. Deploy may have failed."
          exit 1

      - name: Verify AI Service Reachability
        run: |
          if [ -z "${{ secrets.PROD_AI_URL }}" ]; then
            echo "::warning::PROD_AI_URL not set — skipping AI service smoke test."
          else
            curl -sI ${{ secrets.PROD_AI_URL }}/health | head -n 1
          fi